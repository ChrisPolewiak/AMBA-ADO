# EXAMPLE - copy to services.yaml and adjust.
# AMBA services - alert policies for additional Azure services (step 3, bin/amba_services.sh).
# The list is taken from the folder "services" of the AMBA repository, release 2026-06-03.
# Switch a service on or off with "enabled". Default: false. Only services with enabled: true are deployed.
# A service deploys ALL its alerts, unless you narrow it down with the optional keys below.
#
# Keys per service:
#   path: Network/applicationGateways  required; folder relative to services/ in the AMBA release
#   enabled: false                    true = deploy this service; false/omitted = skip
#   include: [AzwafSecRule]          alert names to deploy (as on the service page); empty = all
#   exclude: [CurrentConnections]    alert names to skip; takes precedence over include
#   assignmentManagementGroupId: ""  management group of the assignments (default: services.assignmentManagementGroupId
#                                    in amba.yaml, then LandingZoneManagementGroup)
#   parameters:                      policy parameters for all alerts of the service, e.g.
#     severity: 2
#   overrides:                       policy parameters for one alert, e.g.
#     AzwafSecRule:
#       threshold: 100
#
# Example entry under services (optional settings do not change the entries below):
#   - path: Network/applicationGateways
#     enabled: true
#     include: [AzwafSecRule]
#     exclude: []
#     assignmentManagementGroupId: your-management-group-id
#     parameters:
#       severity: 2
#     overrides:
#       AzwafSecRule:
#         threshold: 100
# Use parameter names supported by the selected alert policy; overrides take precedence
# over service-level parameters. Omit include/exclude to select all alerts.
# Service pages: https://azure.github.io/azure-monitor-baseline-alerts/services/
# The list changes between AMBA releases: after changing deploy.releaseTag check the "services" folder of the release.
